apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: cloud-task-manager-alertmanager
  namespace: monitoring
spec:
  route:
    receiver: cloud-task-manager-webhook
    groupBy:
      - alertname
      - namespace
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
  receivers:
    - name: cloud-task-manager-webhook
      webhookConfigs:
        - url: "http://example.com/webhook"